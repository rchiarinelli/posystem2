plugins {
	id 'java'
	id 'java-library'
	id 'maven-publish'
	id 'org.springframework.boot' version '3.5.3'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.javiersc.semver' version '0.8.0'
	id 'org.openapi.generator' version '7.2.0'
}

group = 'br.com.brainyi'

semver.tagPrefix='v'

ext {
	mockitoVersion = '5.13.0'
	hamcrestVersion = '3.0'
	springDocOpenAPIVersion = '2.8.8'
	openApiGeneratorVersion = '7.13.0'
	jakartaValidationVersion = '3.1.1'
	swaggerVersion = '2.2.31'
	jacksonDatabindVersion = '0.2.6'
	jakartaXmlBindVersion = '4.0.1'
	jaxbRuntimeVersion = '4.0.4'
	commonsLangVersion = '3.17.0'
	queryDslVersion = '5.1.0'
}


bootRun {
    if (project.hasProperty('args')) {
        args project.args.split(',')
    }
}

jar {
    enabled = false
}

bootJar {
    archiveClassifier.set('')
}

springBoot {
	buildInfo()
	mainClass.set("br.com.brainyit.InitApplication")
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenLocal()
	mavenCentral()
	maven {
        url = uri("https://maven.pkg.github.com/rchiarinelli/posystem2")
        credentials {
            username = project.findProperty("gpr.usr") ?: System.getenv("GH_USERNAME")
            password = project.findProperty("gpr.key") ?: System.getenv("GH_TOKEN")
        }
   }
}

configurations.all {
	exclude group: "org.springframework.boot", module: "spring-boot-starter-logging"
}

dependencies {
	implementation "org.springframework.boot:spring-boot-starter-actuator"
	implementation "org.springframework.boot:spring-boot-starter-data-jpa"
	implementation "org.springframework.boot:spring-boot-starter-web"
	implementation "org.springframework.boot:spring-boot-starter-validation"
	implementation "com.google.code.gson:gson"
	implementation "org.springframework.boot:spring-boot-starter-log4j2"
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    implementation "org.slf4j:slf4j-api"
	implementation "com.fasterxml.jackson.core:jackson-databind"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310"

	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:$springDocOpenAPIVersion"
    implementation "org.openapitools:openapi-generator:$openApiGeneratorVersion"
    implementation "jakarta.validation:jakarta.validation-api:$jakartaValidationVersion"

	implementation "org.apache.commons:commons-lang3:$commonsLangVersion"

	implementation "org.openapitools:jackson-databind-nullable:$jacksonDatabindVersion"
	implementation "jakarta.xml.bind:jakarta.xml.bind-api:$jakartaXmlBindVersion"
    implementation "org.glassfish.jaxb:jaxb-runtime:$jaxbRuntimeVersion"

	implementation "com.querydsl:querydsl-jpa:$queryDslVersion:jakarta"
	
	annotationProcessor "org.projectlombok:lombok"
	annotationProcessor "com.querydsl:querydsl-apt:$queryDslVersion:jakarta"
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
	

	testAnnotationProcessor "com.querydsl:querydsl-apt:$queryDslVersion:jakarta"
	testAnnotationProcessor 'jakarta.persistence:jakarta.persistence-api'
	testAnnotationProcessor "org.projectlombok:lombok"

	runtimeOnly "com.mysql:mysql-connector-j"
	compileOnly "org.projectlombok:lombok"

	testImplementation "com.h2database:h2:2.3.232"

	testCompileOnly "org.projectlombok:lombok"

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation "org.testcontainers:junit-jupiter"
	testImplementation "org.testcontainers:mysql"

	testImplementation "org.hamcrest:hamcrest:$hamcrestVersion"
	testImplementation "org.testcontainers:testcontainers"
	
	constraints {
        implementation("io.swagger.core.v3:swagger-annotations:$swaggerVersion")
        implementation("io.swagger.core.v3:swagger-models:$swaggerVersion")
        implementation("io.swagger.core.v3:swagger-core-jakarta:$swaggerVersion")
    }
}

tasks.named('test') {
	useJUnitPlatform()
}


openApiGenerate {
    generatorName = "spring"
	inputSpecRootDirectory.set("$rootDir/src/main/openApiSpecs/")
    outputDir = "$buildDir/generated"
    apiPackage = "br.com.brainyit.posystem2.api"
    modelPackage = "br.com.brainyit.posystem2.model"
    configOptions = [
        useJakartaEe: "true", 
        useSpringBoot3: "true",
		unhandledException: "true",
		useSpringController: "true",
        documentationProvider: "springdoc",
		delegatePattern: "true",
		serializableModel: "true",
		useSpringBuiltInValidation: "true",
		removeUnusedImports: "true",
		useTags: "true",
		apiSuffix: "Api",
        serviceInterface: "true",
		generatedConstructorWithRequiredArgs:"false",
		additionalModelTypeAnnotations:"@lombok.AllArgsConstructor;@lombok.NoArgsConstructor"
    ]
}

sourceSets {
    main {
        java {
            srcDir "${buildDir}/generated/src/main/java"
        }
    }
}

compileJava.dependsOn('openApiGenerate')

clean {
    delete "${buildDir}/generated"
}


publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifact bootJar
            
            groupId = project.group
            artifactId = project.name
            version = project.version
            
            pom {
                name = project.name
                description = 'POSystem2 Backend Application'
                url = 'https://github.com/rchiarinelli/posystem2'
            }
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
            url = "https://maven.pkg.github.com/rchiarinelli/posystem2"
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}



