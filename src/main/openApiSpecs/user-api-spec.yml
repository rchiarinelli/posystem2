openapi: 3.0.0


info:
  title: User API
  version: 1.0.0

tags:
  - name: User
    description: User endpoints
    x-interface-name: UserApi

parameters:
  subscriberParam:
    name: subscriber
    in: path
    required: true
    schema:
      type: string
    description: Subscriber identifier

paths:
  /{subscriber}/about-me:
    get:
      tags:
        - UserApi
      summary: Get information about the current user
      x-interface-name: UserApi
      parameters:
        - $ref: '#/parameters/subscriberParam'
        - name: subscriber
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AboutMeModel'
        '400':
          description: Invalid ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
         
components:
  schemas:
    Message:
      type: object
      properties:
        message:
          type: string

    AboutMeModel:
      type: object
      properties:
        subscriber:
          $ref: '#/components/schemas/SubscriberModel'
        uuid:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string

    SubscriberModel:
      type: object
      properties:
        uuid:
          type: string
        name:
          type: string
        email:
          type: string