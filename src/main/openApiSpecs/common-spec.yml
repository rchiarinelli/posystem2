openapi: 3.0.0

components:
  schemas:
    Message:
      type: object
      properties:
        message:
          type: string
        endpoint:
          type: string
          description: The endpoint that caused the error
        transactionUuid:
          type: string
          description: The transaction UUID

    OrderRestModel:
      type: object
      properties:
        orderCode:
          type: string
        customerName:
          type: string
        orderDescription:
          type: string
        price:
          type: double
        quantity:
          type: double
        deliverDate:
          type: string
        status:
          type: string
        openDate:
          type: string
        closeDate:
          type: string
        orderStatus:
          type: string
        plannedDeliverDate:
          type: string

    BillingModel:
      type: object
      properties:
        uuid:
          type: string
        createdAt:
          type: string
        closedAt:
          type: string
        status:
          type: string
        calculatedValue:
          type: double
        finalValue:
          type: double
        installments:
          type: array
          items:
            $ref: "#/components/schemas/InstallmentModel"
        order:
          $ref: "#/components/schemas/OrderRestModel"

    InstallmentModel:
      type: object
      properties:
        uuid:
          type: string
        dueValue:
          type: double
        dueDate:
          type: string
        createdAt:
          type: string
        paymentDate:
          type: string
        paidValue:
          type: double
        status:
          type: string
