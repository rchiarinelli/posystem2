openapi: 3.0.0

tags:
  - name: Order
    description: Customer order management endpoints
    x-interface-name: OrderApi

parameters:
  subscriberParam:
    name: subscriber
    in: path
    required: true
    schema:
      type: string
    description: Subscriber identifier

paths:
  /{subscriber}/orders:
    post:
      tags:
        - Order
      summary: Create a new order
      x-interface-name: OrderApi
      parameters:
        - $ref: "#/parameters/subscriberParam"
        - name: subscriber
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequestBody"
      responses:
        "200":
          description: Order successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderRestModel"

    get:
      tags:
        - Order
      summary: Get all orders for a subscriber
      x-interface-name: OrderApi
      parameters:
        - name: subscriber
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Filter orders by customer name (partial match)
        - name: orderCode
          in: query
          required: false
          schema:
            type: string
          description: Filter orders by order code (exact match)
        - name: status
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                [PENDING, CLOSED, BILLED, CANCELLED, EXECUTING, DELIVERED, ALL]
          description: Filter orders by status (e.g., PENDING, CLOSED, etc.)
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderRestModel"

  /{subscriber}/orders/{orderCode}:
    get:
      summary: Get order by code
      tags:
        - Order
      x-interface-name: OrderApi
      parameters:
        - name: subscriber
          in: path
          required: true
          schema:
            type: string
        - name: orderCode
          in: path
          required: true
          schema:
            type: string
          description: Order code
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderRestModel"

  /{subscriber}/orders/{orderCode}/cancel:
    put:
      tags:
        - Order
      summary: Cancel an order
      x-interface-name: OrderApi
      parameters:
        - $ref: "#/parameters/subscriberParam"
        - name: subscriber
          in: path
          required: true
          schema:
            type: string
        - name: orderCode
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Reason for canceling the order
                  example: "Customer requested cancellation"
      responses:
        "200":
          description: Order successfully canceled
          content:
            application/json:
              schema:
                $ref: "./common-spec.yml#/components/schemas/Message"

  /{subscriber}/orders/{orderCode}/place-production-order:
    post:
      tags:
        - Order
      summary: Create a production order for an existing order
      x-interface-name: OrderApi
      parameters:
        - $ref: "#/parameters/subscriberParam"
        - name: subscriber
          in: path
          required: true
          schema:
            type: string
        - name: orderCode
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcutionOrderRequestBody"
      responses:
        "200":
          description: Production order successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionOrderRestModel"

components:
  schemas:
    CreateOrderRequestBody:
      type: object
      required:
        - customerId
        - quantity
        - orderDescription
        - plannedDeliverDate
      properties:
        customerId:
          type: integer
        orderDescription:
          type: string
        quantity:
          type: number
          format: double
        plannedDeliverDate:
          type: string
          format: date
          description: Planned deliver date
          example: "2025-01-01"

    OrderRestModel:
      type: object
      properties:
        orderCode:
          type: string
        customerName:
          type: string
        orderDescription:
          type: string
        price:
          type: double
        quantity:
          type: double
        deliverDate:
          type: string
        status:
          type: string
        openDate:
          type: string
        closeDate:
          type: string
        orderStatus:
          type: string
        plannedDeliverDate:
          type: string

    ProcutionOrderRequestBody:
      type: object
      required:
        - qtd
        - estimatedTime
        - instructions
        - plannedStartDate
        - priority
      properties:
        qtd:
          type: number
          format: int
          minimum: 0
          exclusiveMinimum: true
        estimatedTime:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          description: Estimated time in hours
          example: 10
        instructions:
          type: string
        plannedStartDate:
          type: string
          format: date
          description: Planned start date
          example: "2025-01-01"
        priority:
          type: string
          enum: [LOW, STANDARD, HIGH, CRITICAL]
          description: Priority of the production order
          example: "STANDARD"

    ProductionOrderRestModel:
      $ref: "./order-spec.yml#/components/schemas/ProductionOrderRestModel"
