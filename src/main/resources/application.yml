server:
  servlet:
    context-path: /api

spring:
  application:
    name: posystem2-dev

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/po
          jwk-set-uri: http://localhost:8081/realms/po/protocol/openid-connect/certs

  datasource:
      name: posystem2-ds
      url: jdbc:mysql://localhost:3306/sas_db
      username: sas_app
      password: abcd4321
      driver-class-name: com.mysql.cj.jdbc.Driver        
  jpa:
      show-sql: true
      defer-datasource-initialization: true
      hibernate:
          ddl-auto: validate

logging:
  level:
    org:
      springframework:
        security: DEBUG

#### application and security settings

application:
    language: pt-BR
    order-code-prefix: PED-
    order-code-length: 5
    production-order-code-prefix: PO-
    production-order-work-day-hours: 8


cors:
    mapping: /**
    allowed-origins-patterns: http://**, https://**
    allowed-methods: GET, POST, PUT, DELETE, OPTIONS
    allowed-headers: "*"

security:
    api:
        non-protected-apis: /actuator/**, /swagger-ui/**, /v3/api-docs/**
        protected-apis: /**