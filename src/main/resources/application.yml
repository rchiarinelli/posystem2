server:
  servlet:
    context-path: /

spring:
  datasource:
    hikari:
      pool-name: posystem-ds
      driver-class-name: org.h2.Driver
      jdbc-url: jdbc:h2:mem::posystem_db
      username: sa
      password:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create
  h2:
    console:
      enabled: true

