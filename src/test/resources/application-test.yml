server:
  servlet:
    context-path: /

logging:
  level:
    br.com.brainyit: DEBUG

spring:
  config:
    activate:
      on-profile: test
  datasource:
    hikari:
      pool-name: posystem-ds-test
      driver-class-name: org.h2.Driver
      jdbc-url: jdbc:h2:mem::posystem_db-test
      username: sa
      password:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create



#### application and security settings

application:
    language: pt-BR
    order-code-prefix: PED-
    order-code-length: 5


cors:
    mapping: /**
    allowed-origins-patterns: http://**, https://**
    allowed-methods: GET, POST, PUT, DELETE, OPTIONS
    allowed-headers: "*"

security:
    api:
        non-protected-apis: /actuator/**, /swagger-ui/**, /v3/api-docs/**
        protected-apis: /**




