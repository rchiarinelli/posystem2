services:

  db-test:
    image: postgres:17.5-alpine3.21
    restart: always
    ports:
      - "5433:5432"
    networks:
      - local-env-network
    environment:
      POSTGRES_USER: sas_app
      POSTGRES_DB: sas_db
      POSTGRES_PASSWORD: abcd4321
    command: postgres -c max_prepared_transactions=10
    deploy:
      resources:
        limits:
          memory: 1GB  

  db:
    image: postgres:17.5-alpine3.21
    restart: always
    ports:
      - "5432:5432"
    networks:
      - local-env-network
    volumes:
        - ./src/etc/containers/db/sql/:/docker-entrypoint-initdb.d/
    environment:
      POSTGRES_PASSWORD: abcd4321
    deploy:
      resources:
        limits:
          memory: 1GB    


  auth-server:
    image: ghcr.io/rchiarinelli/base-auth-server:local
    depends_on:
      - db
    environment:
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 7080
      KC_HOSTNAME_STRICT_BACKCHANNEL: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: info

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/sas_auth_server_db
      KC_DB_USERNAME: sas_app
      KC_DB_PASSWORD: abcd4321
      KC_TRANSACTION_XA_ENABLED: true
      
      QUARKUS_DATASOURCE_USERS_DB_KIND: postgresql
      QUARKUS_DATASOURCE_USERS_USERNAME: sas_app
      QUARKUS_DATASOURCE_USERS_PASSWORD: abcd4321
      QUARKUS_DATASOURCE_USERS_JDBC_URL: jdbc:postgresql://db:5432/sas_db
      QUARKUS_DATASOURCE_USERS_JDBC_TRANSACTIONS: disabled

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health/ready"]
      interval: 15s
      timeout: 2s
      retries: 15
    command: ["start-dev", "--http-port", "7080", "--https-port", "7443", "--import-realm"]
    restart: always
    volumes:
      - ./src/etc/containers/authserver/local-po-realm.json:/opt/keycloak/data/import/po-realm.json
    ports:
      - "8081:7080"
      - "7443:7443"
      - "5005:5005"
    networks:
      - local-env-network
    deploy:
      resources:
        limits:
          memory: 1GB

  admin-services:
    image: ghcr.io/rchiarinelli/base-sas-backend:local
    network_mode: host
    depends_on:
      - db
      - auth-server
    restart: always
    volumes:
      - ./src/etc/containers/admin-services/application.yml:/opt/config/application.yml
    deploy:
      resources:
        limits:
          memory: 256M

  # posystem-services:
  #   image: ghcr.io/rchiarinelli/posystem2:local
  #   network_mode: host
  #   depends_on:
  #     - db
  #     - auth-server
  #   restart: always
  #   volumes:
  #     - ./src/etc/containers/posystem/application.yml:/opt/config/application.yml
  #   deploy:
  #     resources:
  #       limits:
